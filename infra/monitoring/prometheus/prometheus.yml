global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules.yaml"

scrape_configs:
  - job_name: "asoc-api"
    static_configs:
      - targets: ["asoc-api:8080"]
    metrics_path: /metrics

  - job_name: "asoc-worker"
    static_configs:
      - targets: ["asoc-triage-worker:9100"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9101"]

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
