version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ASOC — Local Full-Stack Development Environment
# Usage: docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Data Layer ─────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092", "9101:9101"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: 
    - /bin/sh
    - -c
    - |
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic security.raw_logs --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic security.threat_intel --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic security.decisions --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic security.lessons --partitions 1 --replication-factor 1
      echo "Kafka topics created."
    

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data/clickhouse/migrations:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: asoc
      POSTGRES_USER: asoc
      POSTGRES_PASSWORD: asoc_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asoc -d asoc"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports: ["8000:8000"]
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      retries: 5

  # ── Intelligence Layer ─────────────────────────────────────────────────────

  asoc-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports: ["8080:8080"]
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      chromadb:  { condition: service_healthy }
      kafka:     { condition: service_healthy }
    environment:
      DATABASE_URL:        postgresql+psycopg2://asoc:asoc_dev_password@postgres:5432/asoc
      REDIS_HOST:          redis
      CHROMADB_HOST:       chromadb
      CLICKHOUSE_HOST:     clickhouse
      KAFKA_BOOTSTRAP:     kafka:29092
      LLM_PROVIDER:        anthropic
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:      ${OPENAI_API_KEY}
      CORS_ORIGINS:        http://localhost:3000
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - .:/app

  asoc-triage-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP:     kafka:29092
      REDIS_HOST:          redis
      CHROMADB_HOST:       chromadb
      CLICKHOUSE_HOST:     clickhouse
      LLM_PROVIDER:        anthropic
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:      ${OPENAI_API_KEY}
    command: python -m data.kafka.consumer

  # ── Presentation Layer ──────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - asoc-api

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: asoc_admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  clickhouse_data:
  postgres_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: asoc-network
